<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PadDeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2311151a'/%3E%3Crect x='4' y='4' width='4.5' height='4.5' rx='1' fill='%23e47987'/%3E%3Crect x='9.75' y='4' width='4.5' height='4.5' rx='1' fill='%233276bf'/%3E%3Crect x='15.5' y='4' width='4.5' height='4.5' rx='1' fill='%23334155'/%3E%3Crect x='4' y='9.75' width='4.5' height='4.5' rx='1' fill='%23334155'/%3E%3Crect x='9.75' y='9.75' width='4.5' height='4.5' rx='1' fill='%23eaf3fe'/%3E%3Crect x='15.5' y='9.75' width='4.5' height='4.5' rx='1' fill='%233276bf'/%3E%3Crect x='4' y='15.5' width='4.5' height='4.5' rx='1' fill='%233276bf'/%3E%3Crect x='9.75' y='15.5' width='4.5' height='4.5' rx='1' fill='%23334155'/%3E%3Crect x='15.5' y='15.5' width='4.5' height='4.5' rx='1' fill='%23e47987'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="5.5" height="5.5" rx="1.2" fill="#e47987"/>
        <rect x="9.25" y="2" width="5.5" height="5.5" rx="1.2" fill="#3276bf"/>
        <rect x="16.5" y="2" width="5.5" height="5.5" rx="1.2" fill="#334155"/>
        <rect x="2" y="9.25" width="5.5" height="5.5" rx="1.2" fill="#334155"/>
        <rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1.2" fill="#eaf3fe"/>
        <rect x="16.5" y="9.25" width="5.5" height="5.5" rx="1.2" fill="#3276bf"/>
        <rect x="2" y="16.5" width="5.5" height="5.5" rx="1.2" fill="#3276bf"/>
        <rect x="9.25" y="16.5" width="5.5" height="5.5" rx="1.2" fill="#334155"/>
        <rect x="16.5" y="16.5" width="5.5" height="5.5" rx="1.2" fill="#e47987"/>
      </svg>
      <span>PadDeck</span>
    </div>
    <span class="chip" id="pad-chip" data-state="off"><span class="dot"></span><span id="pad-chip-text">Starting</span></span>
    <span class="chip" id="obs-chip" data-state="off" hidden><span class="dot"></span><span id="obs-chip-text">OBS</span></span>
    <button class="chip show-chip" id="show-chip" type="button" title="Stop the light show" hidden><span class="dot"></span><span id="show-chip-text">Light show</span><span aria-hidden="true">×</span></button>
    <div class="spacer"></div>
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
    <button class="btn ghost" id="pause-btn" aria-pressed="false" title="Stop pads from running actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span>Pause</span>
    </button>
    <button class="btn ghost" id="settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      <span>Settings</span>
    </button>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main class="layout">
    <section class="stage" aria-label="Launchpad">
      <nav class="pages" id="pages" aria-label="Pages"></nav>
      <div class="device-wrap">
        <div class="device" id="device" role="grid" aria-label="Launchpad buttons. Use arrow keys to move between pads. Right-click a pad for more options."></div>
      </div>
      <div class="hint">
        <span>Click a pad to set it up. Drag it to move it (Ctrl to copy). Double-click to try it. Right-click to reset or delete.</span>
        <label class="check"><input type="checkbox" id="follow-press" checked> Select pads by pressing them on the Launchpad</label>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Button settings"></aside>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dlg-head">
      <h2 id="settings-title">Settings</h2>
      <button class="btn icon ghost" id="settings-close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="settings-body"></div>
  </dialog>

  <dialog id="picker" aria-labelledby="picker-title">
    <div class="dlg-head">
      <h2 id="picker-title">Choose an app</h2>
      <button class="btn icon ghost" id="picker-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="picker-search"><input type="text" id="picker-q" autocomplete="off" aria-label="Search"></div>
    <div class="picker-list" id="picker-list" role="listbox" aria-label="Apps"></div>
    <p class="picker-foot" id="picker-foot"></p>
  </dialog>

  <datalist id="dl-audio"></datalist>
  <datalist id="dl-scenes"></datalist>
  <datalist id="dl-inputs"></datalist>
  <datalist id="dl-keys">
    <option value="F13"></option><option value="F14"></option><option value="F15"></option><option value="F16"></option>
    <option value="F17"></option><option value="F18"></option><option value="F19"></option><option value="F20"></option>
    <option value="F21"></option><option value="F22"></option><option value="F23"></option><option value="F24"></option>
    <option value="Ctrl+Shift+F13"></option><option value="Win+Shift+S"></option><option value="Alt+Tab"></option>
  </datalist>

  <script src="/app.js"></script>
</body>
</html>
